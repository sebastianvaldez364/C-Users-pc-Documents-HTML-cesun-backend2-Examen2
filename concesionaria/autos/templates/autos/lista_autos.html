{% extends 'autos/base.html' %}

{% block contenido %}

<h2 class="text-center mb-4">Lista de Automóviles</h2>

<div class="card shadow">

    <div class="card-body">

        <table class="table table-striped table-bordered">

            <thead class="table-dark">

                <tr>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Año</th>
                    <th>Precio</th>
                </tr>

            </thead>

            <tbody>

                {% for auto in autos %}

                <tr>

                    <td>{{ auto.marca }}</td>

                    <td>{{ auto.modelo }}</td>

                    <td>{{ auto.año }}</td>

                    <td>${{ auto.precio }}</td>

                </tr>

                {% empty %}

                <tr>
                    <td colspan="4" class="text-center">
                        No hay automóviles registrados.
                    </td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

        <a href="{% url 'agregar_auto' %}" class="btn btn-primary">
            Registrar nuevo automóvil
        </a>

    </div>

</div>

{% endblock %}
